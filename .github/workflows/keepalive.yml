# Interim Supabase keep-alive (spec 007, T008a). The free tier pauses a project
# after ~7 days without API activity; the real keep-alive is the Vercel cron
# over /api/keepalive (T007), which only runs on Production deploys, and the
# dev -> main promotion (T020) is waiting on the Resend/DNS track.
#
# Lives on `main` because GitHub fires `schedule` and `workflow_dispatch` only
# for workflow files on the default branch. T008 deletes this file (on `main`)
# and its four repo secrets once the first Vercel cron run is green.

name: Keep-alive (interim)

on:
  schedule:
    # Daily at 12:00 UTC, matching vercel.json's schedule for /api/keepalive.
    - cron: '0 12 * * *'
  workflow_dispatch:

# Nothing here needs GITHUB_TOKEN: no checkout, no API calls to GitHub.
permissions: {}

# Only anon keys are used — public by design (shipped in the browser bundle) —
# and `events` is the one table anon may read, so nothing private is touched.
jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      # One step per project so a failure names which one is unreachable.
      # --fail-with-body makes a non-2xx exit non-zero and still print the body.
      - name: Ping dev project
        run: |
          curl --fail-with-body -sS \
            -H "apikey: ${{ secrets.KEEPALIVE_DEV_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.KEEPALIVE_DEV_ANON_KEY }}" \
            "${{ secrets.KEEPALIVE_DEV_URL }}/rest/v1/events?select=id&limit=1"

      - name: Ping prod project
        run: |
          curl --fail-with-body -sS \
            -H "apikey: ${{ secrets.KEEPALIVE_PROD_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.KEEPALIVE_PROD_ANON_KEY }}" \
            "${{ secrets.KEEPALIVE_PROD_URL }}/rest/v1/events?select=id&limit=1"
